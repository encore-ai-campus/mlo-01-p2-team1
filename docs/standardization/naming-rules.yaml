version: 1
language:
  logical_name: ko
  physical_name: en
rules:
  physical_case: lower_snake_case
  physical_name_pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$'
  maximum_length: 63
  entity_noun_number: singular
  word_separator: '_'
  word_order: qualifier_entity_property
  identifier_suffix: '_id'
  number_suffix: '_number'
  code_suffix: '_code'
  name_suffix: '_name'
  hash_suffix: '_hash'
  datetime_suffix: '_datetime'
  yes_no_suffix: '_yn'
  hierarchy_qualifiers:
    immediate_parent: 'parent_'
    root_or_top: 'top_'
  approved_abbreviations:
    - id
    - sha256
    - yn
  prohibited_legacy_abbreviations:
    - no
    - nm
    - p
    - mgr
    - dept
    - pos
    - dtm
    - act
    - lvl
    - reg
    - at
  boolean_rule: 물리명은 _yn으로 끝나며 표준값은 Y 또는 N만 사용한다.
  datetime_rule: 날짜와 시각을 함께 가지는 물리명은 _datetime으로 끝낸다.
  source_preservation_rule: raw CSV의 레거시 컬럼명과 값은 변경하지 않고 curated 모델에서만 표준 물리명을 적용한다.
examples:
  valid:
    - business_area_id
    - parent_business_area_name
    - manager_department_name
    - manager_active_yn
    - scheduled_release_datetime
    - source_record_sha256_hash
  invalid:
    - area_no
    - p_area_nm
    - mgr_dept_nm
    - mgr_act_yn
    - scheduled_release_at
    - topAreaId
