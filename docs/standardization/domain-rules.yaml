version: 1

normalization_policy:
  apply_to: curated_or_standardized_layer_only
  raw_preservation: raw CSV의 컬럼명과 셀 값은 변경·trim·형변환하지 않는다.
  nullable_standard_columns: [parent_business_area_id]
  required_value_violation_action: reject_record_and_log_reason
  text:
    unicode_normalization: NFKC
    outer_whitespace: trim
    tab_and_unicode_space: convert_to_ascii_space
    repeated_whitespace: collapse_to_single_space
    single_internal_whitespace: 사전 매핑 없이 임의 삭제하지 않고 품질 검토 대상으로 남긴다.
  null_tokens:
    case_insensitive: true
    values: ['', '-', 'NULL', 'N/A', 'NA', 'UNKNOWN']
  identifier:
    business_area_id:
      source_columns: [area_no, top_area_no]
      rule: 접두사와 숫자 사이의 공백·하이픈·밑줄을 제거하고 대문자로 바꾼 뒤 BIZ_##### 형식으로 재구성한다.
      reject_if_unmatched: true
    parent_business_area_id:
      source_columns: [p_area_no]
      rule: business_area_id 규칙을 적용하되 없음은 NULL로 변환한다.
      additional_null_tokens: [없음]
      reject_if_unmatched: true
    manager_id:
      source_columns: [mgr_no]
      rule: 접두사와 숫자 사이의 공백·하이픈·밑줄을 제거하고 대문자로 바꾼 뒤 EMP###### 형식으로 재구성한다.
      invalid_required_tokens: [UNKNOWN]
      invalid_action: reject_record_and_log_reason
      reject_if_unmatched: true
  datetime:
    source_columns: [mgr_hire_dtm, area_reg_dtm, top_area_reg_dtm]
    accepted_source_formats:
      - '%Y-%m-%dT%H:%M:%S'
      - '%Y-%m-%d %H:%M:%S'
      - '%Y-%m-%d %H:%M:%S.%f'
      - '%Y/%m/%d %H:%M:%S'
      - '%Y.%m.%d %H:%M:%S'
      - '%Y%m%d%H%M%S'
    target_format: '%Y-%m-%dT%H:%M:%S'
    invalid_sentinels:
      - '0000-00-00 00:00:00'
      - '9999-99-99 99:99:99'
      - '9999/99/99 99:99:99'
    invalid_action: reject_record_and_log_reason
  top_area_level_code:
    source_columns: [top_area_lvl]
    value_map:
      '1': TOP
      L1: TOP
      TOP_LEVEL: TOP
      top_level: TOP
      'TOP LEVEL': TOP
      최상위: TOP
    invalid_required_values: [UNKNOWN]
    invalid_action: reject_record_and_log_reason
  manager_active_yn:
    source_columns: [mgr_act_yn]
    case_insensitive: true
    trim_before_mapping: true
    value_map:
      Y: Y
      YES: Y
      '1': Y
      사용: Y
      재직: Y
      N: N
      NO: N
      '0': N
      미사용: N
      퇴직: N
    invalid_required_values: [UNKNOWN]
    invalid_action: reject_record_and_log_reason
  manager_position_name:
    source_columns: [mgr_pos_nm]
    remove_internal_space_only_after_dictionary_match: true
    allowed_values: [팀장, 과장, 차장, 실장, 대리, 부장, 사원, 파트장, 기타]
    invalid_required_values: [미상]
    invalid_action: reject_record_and_log_reason

domains:
  - domain_id: BUSINESS_AREA_ID
    description: BIZ_ 접두사와 숫자 5자리로 구성한 필수 업무영역 식별자
    logical_type: identifier
    python_type: str
    database_type: VARCHAR
    length: 9
    nullable: false
    format: '^BIZ_[0-9]{5}$'
    allowed_values: []
    examples:
      - BIZ_11608
  - domain_id: OPTIONAL_BUSINESS_AREA_ID
    description: BIZ_ 접두사와 숫자 5자리로 구성하며 상위 영역이 없으면 NULL인 업무영역 식별자
    logical_type: identifier
    python_type: str
    database_type: VARCHAR
    length: 9
    nullable: true
    format: '^BIZ_[0-9]{5}$'
    allowed_values: []
    examples:
      - BIZ_00170
  - domain_id: BUSINESS_AREA_NAME
    description: 공백 정규화 후 1자 이상 100자 이하인 필수 업무영역 이름
    logical_type: name
    python_type: str
    database_type: VARCHAR
    length: 100
    nullable: false
    format: '^.{1,100}$'
    allowed_values: []
    examples:
      - 보안관리
      - 기획
  - domain_id: TOP_AREA_LEVEL_CODE
    description: 최상위 업무영역의 필수 표준 레벨 코드
    logical_type: code
    python_type: str
    database_type: VARCHAR
    length: 3
    nullable: false
    format: '^TOP$'
    allowed_values:
      - TOP
    examples:
      - TOP
  - domain_id: MANAGER_ID
    description: EMP 접두사와 숫자 6자리로 구성한 필수 담당자 식별자
    logical_type: identifier
    python_type: str
    database_type: VARCHAR
    length: 9
    nullable: false
    format: '^EMP[0-9]{6}$'
    allowed_values: []
    examples:
      - EMP000038
  - domain_id: PERSON_NAME
    description: 공백 정규화 후 1자 이상 100자 이하인 필수 사람 이름
    logical_type: name
    python_type: str
    database_type: VARCHAR
    length: 100
    nullable: false
    format: '^.{1,100}$'
    allowed_values: []
    examples:
      - 이민서
  - domain_id: DEPARTMENT_NAME
    description: 공백 정규화 후 1자 이상 100자 이하인 필수 부서 이름
    logical_type: name
    python_type: str
    database_type: VARCHAR
    length: 100
    nullable: false
    format: '^.{1,100}$'
    allowed_values: []
    examples:
      - 분석팀
  - domain_id: MANAGER_POSITION_NAME
    description: 사전에 등록된 필수 담당자 직위 이름
    logical_type: name
    python_type: str
    database_type: VARCHAR
    length: 10
    nullable: false
    format: '^[가-힣]+$'
    allowed_values:
      - 팀장
      - 과장
      - 차장
      - 실장
      - 대리
      - 부장
      - 사원
      - 파트장
      - 기타
    examples:
      - 팀장
      - 대리
  - domain_id: DATETIME_ISO_SECOND
    description: 여러 레거시 형식을 파싱하여 초 단위 ISO 8601로 통일한 필수 일시
    logical_type: datetime
    python_type: datetime
    database_type: DATETIME
    nullable: false
    format: '%Y-%m-%dT%H:%M:%S'
    allowed_values: []
    examples:
      - '2021-12-01T05:30:46'
  - domain_id: YES_NO
    description: 참과 거짓을 Y 또는 N 한 글자로 표현한 필수 값
    logical_type: boolean
    python_type: str
    database_type: CHAR
    length: 1
    nullable: false
